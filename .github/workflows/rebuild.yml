name: Rebuild site from Airtable

on:
  schedule:
    # every 6 hours: Airtable edits go live the same working day without
    # racing manual pushes every half hour (use "Run workflow" for instant)
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # editing this file is a deliberate "run me now" — a no-UI manual trigger
    # last kicked: 2026-09-10, for the updated Site Logo
    paths: [".github/workflows/rebuild.yml"]

# one rebuild at a time. Two overlapping runs both commit media and the
# second one's push is rejected, which is how "all jobs have failed" arrives
# in the inbox after a couple of quick pushes.
concurrency:
  group: rebuild-from-airtable
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # optimise.mjs re-encodes video and converts gif animations, and
      # make-posters.mjs pulls a still for each clip. All three shell out to
      # ffmpeg, which the runner image does not carry. Without this the steps
      # warned and carried on, so the job kept reporting success while every
      # master came back uncompressed.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Refresh from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node refresh.mjs

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing changed, skipping commit"
          else
            git commit -m "Rebuild from Airtable [skip ci]"
            # main can move while a rebuild runs — someone pushes, or the
            # previous run lands. Rebase onto it and retry rather than
            # failing the whole rebuild on a non-fast-forward.
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                echo "pushed on attempt $attempt"
                exit 0
              fi
              echo "push attempt $attempt failed; retrying"
              sleep 5
            done
            echo "could not push after 3 attempts"
            exit 1
          fi

