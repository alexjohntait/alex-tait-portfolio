  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #ffffff;
      --ink:   #16120f;
      --red:   #ff1d19;
      --pink:  #ff69b4;
      --green: #02b34b;
      --muted: #6b625c;
      --line:  rgba(22, 18, 15, 0.12);

      --display: 'Bricolage Grotesque', 'Hanken Grotesk', sans-serif;
      --body: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;

      /* motion roles: entrances/exits, hovers, and rare playful springs */
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease:     cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --spring:   cubic-bezier(0.34, 1.56, 0.64, 1);

      --pad: clamp(16px, 4vw, 40px);
      --glow: 22%;
    }

    /* Dark mode (triggered by the pink accent) */
    :root[data-theme="dark"] {
      --paper: #141110;
      --ink:   #f7f1ea;
      --muted: #a79e96;
      --line:  rgba(247, 241, 234, 0.16);
      --glow:  34%;
    }

    html { scroll-behavior: smooth; }
    :root { transition: --glow 0.4s; }
    body, header, .filters button, .meta-row, .card-thumb {
      transition: background-color 0.4s var(--ease-out), color 0.4s var(--ease-out), border-color 0.4s var(--ease-out);
    }

    body {
      min-height: 100vh;
      font-family: var(--body);
      font-weight: 500;
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* Subtle edge glow — two layers crossfade by opacity (GPU, jank-free)
       so the colour can change without repainting a box-shadow each frame */
    .glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.45s var(--ease-out);
    }

    .skip-link {
      position: absolute; top: -999px; left: 16px;
      background: var(--ink); color: var(--paper);
      font-family: var(--body); font-size: 13px; font-weight: 600;
      padding: 10px 16px; z-index: 200; text-decoration: none; border-radius: 2px;
    }
    .skip-link:focus { top: 12px; }

    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; border-radius: 2px; }

    /* ─────────────────────────── HEADER ─────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 18px var(--pad);
      background: color-mix(in srgb, var(--paper) 88%, transparent);
      backdrop-filter: saturate(1.4) blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(22px, 3vw, 30px);
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: baseline;
      gap: 0;
    }
    /* playful per-letter hover ripple — letters bounce up in a wave */
    .wordmark span {
      display: inline-block;
      transition: transform 0.45s var(--spring), color 0.45s var(--ease-out);
    }
    .wordmark:hover span { color: var(--red); }
    .wordmark:hover span:nth-child(1) { transform: translateY(-9px) rotate(-8deg); transition-delay: 0s; }
    .wordmark:hover span:nth-child(2) { transform: translateY(-9px) rotate(6deg);  transition-delay: 0.035s; }
    .wordmark:hover span:nth-child(3) { transform: translateY(-9px) rotate(-6deg); transition-delay: 0.07s; }
    .wordmark:hover span:nth-child(4) { transform: translateY(-9px) rotate(7deg);  transition-delay: 0.105s; }
    .wordmark:hover span:nth-child(5) { transform: translateY(-9px);               transition-delay: 0.14s; }
    .wordmark:hover span:nth-child(6) { transform: translateY(-9px) rotate(-7deg); transition-delay: 0.175s; }
    .wordmark:hover span:nth-child(7) { transform: translateY(-9px) rotate(6deg);  transition-delay: 0.21s; }
    .wordmark:hover span:nth-child(8) { transform: translateY(-9px) rotate(-6deg); transition-delay: 0.245s; }
    .wordmark:hover span:nth-child(9) { transform: translateY(-9px) rotate(8deg);  transition-delay: 0.28s; }
    @media (prefers-reduced-motion: reduce) {
      .wordmark span { transition: color 0.2s; }
      .wordmark:hover span { transform: none; }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: clamp(16px, 3vw, 32px);
    }

    .nav {
      display: flex;
      gap: clamp(14px, 2vw, 26px);
    }
    .nav a {
      font-family: var(--body);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      color: var(--ink);
      position: relative;
      /* taller hit area (44px) */
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 4px 0;
    }
    .nav a::after {
      content: '';
      position: absolute;
      left: 0; bottom: 9px;
      width: 100%; height: 2px;
      background: var(--red);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.32s var(--ease-out);
    }
    .nav a:hover::after,
    .nav a.current::after { transform: scaleX(1); }
    .nav a.current { color: var(--red); }

    .dots { display: inline-flex; align-items: center; gap: 13px; }
    .dot {
      width: 15px; height: 15px; border-radius: 50%;
      border: none; padding: 0; cursor: pointer;
      background: var(--c);
      position: relative;
      transition: transform 0.22s var(--spring), box-shadow 0.22s var(--ease);
    }
    /* invisible, non-overlapping hit area for touch (WCAG 2.5.5 spacing) */
    .dot::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 26px; height: 26px;
      transform: translate(-50%, -50%);
    }
    .dot:hover { transform: scale(1.3) translateY(-2px); }
    .dot:active { transform: scale(1.05); }
    .dot.active {
      box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--c);
    }
    /* one-time playful entrance — bob in once on load, then rest */
    @media (prefers-reduced-motion: no-preference) {
      .dot { animation: dotIn 0.5s var(--spring) both; }
      .dot:nth-child(1) { animation-delay: 0.15s; }
      .dot:nth-child(2) { animation-delay: 0.24s; }
      .dot:nth-child(3) { animation-delay: 0.33s; }
    }
    @keyframes dotIn {
      0%   { transform: scale(0.4) translateY(-6px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* ─────────────────────────── VIEWS ─────────────────────────── */
    main { display: block; }

    .view { display: none; }
    .view.active { display: block; }

    /* Entrance is handled by the View Transition (route changes) and the
       grid scroll-reveal (home). A self-animating .view conflicts with the
       VT snapshot of the morph target, so it's intentionally omitted. */

    /* ─────────────────────── CONTROL ROW (home) ─────────────────── */
    .controls {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      padding: clamp(24px, 5vw, 48px) var(--pad) 20px;
    }

    /* reserved height + line clamps so swapping titles/captions of any
       length never reflows the grid below */
    .controls-lead {
      max-width: 42ch;
      min-height: clamp(104px, 12vw, 158px);
    }
    .controls-lead h1 {
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(28px, 5vw, 52px);
      letter-spacing: -0.035em;
      line-height: 0.98;
      text-wrap: balance;
      transition: opacity 0.18s var(--ease-out);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }
    .controls-lead p {
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.35;
      letter-spacing: -0.01em;
      transition: opacity 0.18s var(--ease-out);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }
    .controls.fading .controls-lead h1,
    .controls.fading .controls-lead p { opacity: 0; }

    .filters {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .filters button {
      font-family: var(--body);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--muted);
      background: none;
      border: 1px solid transparent;
      border-radius: 100px;
      /* 44px min touch target (WCAG 2.5.5) */
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 8px 18px;
      cursor: pointer;
      transition: color 0.2s var(--ease), background 0.2s var(--ease), transform 0.18s var(--ease);
    }
    @media (hover: hover) and (pointer: fine) {
      .filters button:hover { color: var(--ink); transform: translateY(-2px); }
    }
    .filters button:active { transform: scale(0.96); }
    .filters button.active {
      color: var(--paper);
      background: var(--ink);
    }

    /* ─────────────────── GRID (flowing masonry) ─────────────────── */
    /* Each piece keeps its native ratio and flows into columns —
       varied heights break the rigid 'square' grid. */
    .grid {
      column-width: clamp(220px, 24vw, 300px);
      column-gap: clamp(14px, 2vw, 22px);
      padding: 12px var(--pad) clamp(48px, 8vw, 96px);
    }

    .card {
      cursor: pointer;
      position: relative;
      break-inside: avoid;
      margin-bottom: clamp(20px, 2.6vw, 34px);
      transition: transform 0.25s var(--ease);
      display: block;
      color: inherit;
      text-decoration: none;
    }
    .card:active { transform: scale(0.98); }
    @media (hover: hover) and (pointer: fine) {
      .card:hover { transform: translateY(-5px); }
    }

    .card-thumb {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 6px;
      /* aspect-ratio set per-card inline (from the file's true dimensions)
         so columns pack correctly with no layout shift */
    }
    .card-thumb img,
    .card-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s var(--ease);
    }
    @media (hover: hover) and (pointer: fine) {
      .card:hover .card-thumb img,
      .card:hover .card-thumb video { transform: scale(1.05); }
    }
    .card:focus-visible .card-thumb img,
    .card:focus-visible .card-thumb video { transform: scale(1.05); }

    /* corner index badge that pops on hover */
    .card-index {
      position: absolute;
      top: 10px; left: 10px;
      z-index: 2;
      font-family: var(--display);
      font-weight: 700;
      font-size: 12px;
      color: var(--paper);
      mix-blend-mode: difference;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.3s var(--ease-out), transform 0.3s var(--spring);
    }
    .card:hover .card-index { opacity: 1; transform: translateY(0); }

    .card-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 2px 4px;
    }
    .card-title {
      font-family: var(--display);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.15;
    }
    .card-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: -0.01em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .card.hidden { display: none; }

    /* ─────────────────── PROJECT DETAIL (stage) ─────────────────── */
    /* Big media on the left at its natural size; sticky info rail on the
       right so title/meta/description stay in view however tall the art is. */
    .project-stage {
      display: grid;
      grid-template-columns: minmax(0, 1.9fr) minmax(280px, 0.85fr);
      gap: clamp(24px, 4vw, 60px);
      padding: clamp(14px, 2vw, 22px) var(--pad) clamp(32px, 5vw, 56px);
      align-items: start;
    }

    /* Single piece: shown whole at natural ratio, fitted to the viewport,
       on the page's own white — honest negative space, no colour fill. */
    .project-solo {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .project-solo img,
    .project-solo video {
      max-width: 100%;
      max-height: calc(100svh - 168px);
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      border-radius: 8px;
    }

    /* Multiple pieces: hero + gallery flow together as a masonry, each at
       its true ratio, so portraits get a neighbour instead of empty space. */
    .project-masonry {
      /* 2 columns for impact (work reads big), 1 on mobile */
      columns: 2;
      column-gap: clamp(16px, 1.8vw, 22px);
    }
    .project-masonry .m-item {
      break-inside: avoid;
      margin-bottom: clamp(16px, 1.8vw, 22px);
      border-radius: 8px;
      overflow: hidden;
      display: block;
    }
    .project-masonry .m-item img,
    .project-masonry .m-item video {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      transition: transform 0.6s var(--ease-out);
    }
    .project-masonry .m-item:hover img,
    .project-masonry .m-item:hover video { transform: scale(1.03); }
    @media (max-width: 560px) {
      .project-masonry { column-width: auto; columns: 1; }
    }

    .project-info {
      position: sticky;
      top: clamp(84px, 9vw, 104px);
      display: flex;
      flex-direction: column;
    }
    /* info rail composes itself in after the hero morph lands */
    @media (prefers-reduced-motion: no-preference) {
      @keyframes infoUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .project-info > * { animation: infoUp 0.4s var(--ease-out) both; }
      .project-info > *:nth-child(1) { animation-delay: 0.10s; }
      .project-info > *:nth-child(2) { animation-delay: 0.16s; }
      .project-info > *:nth-child(3) { animation-delay: 0.22s; }
      .project-info > *:nth-child(4) { animation-delay: 0.28s; }
    }

    .pview-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: clamp(16px, 2.5vw, 26px) var(--pad) 0;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--body);
      font-size: 14px; font-weight: 600;
      text-decoration: none; color: var(--ink);
      min-height: 44px;
      transition: gap 0.25s var(--ease-out), color 0.2s;
    }
    .back-link:hover { gap: 12px; color: var(--red); }
    .pview-count {
      font-family: var(--display);
      font-size: 14px; font-weight: 700;
      color: var(--muted);
    }

    .project-title {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(30px, 3.4vw, 46px);
      letter-spacing: -0.04em;
      line-height: 0.98;
      text-wrap: balance;
      margin-bottom: 22px;
    }

    .project-meta {
      display: flex; flex-direction: column;
      border-top: 2px solid var(--ink);
      margin-bottom: 22px;
    }
    .meta-row {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
    }
    .meta-label {
      font-size: 12px; font-weight: 600; color: var(--muted);
      letter-spacing: -0.01em;
    }
    .meta-value {
      font-family: var(--display);
      font-size: 16px; font-weight: 700;
      letter-spacing: -0.025em;
      text-align: right;
    }

    .project-desc {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.62;
      color: var(--muted);
      text-wrap: pretty;
    }
    .project-desc p + p { margin-top: 0.9em; }

    /* static labels — same role/treatment as the card category text */
    .project-tags {
      display: flex; flex-wrap: wrap; gap: 6px 14px;
      margin-top: 20px;
    }
    .project-tag {
      font-size: 13px; font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--muted);
    }
    .project-tag:not(:last-child)::after {
      content: '·';
      margin-left: 14px;
      color: var(--line);
    }

    .project-nav {
      display: flex;
      border-top: 1px solid var(--line);
      margin: 0 var(--pad);
    }
    .pnav {
      flex: 1;
      display: flex; flex-direction: column; gap: 4px;
      padding: 24px 0 clamp(40px, 6vw, 72px);
      background: none; border: none; cursor: pointer;
      font-family: var(--body); text-align: left;
      transition: opacity 0.2s;
    }
    .pnav:last-child { text-align: right; align-items: flex-end; }
    .pnav:hover { opacity: 0.55; }
    .pnav:disabled { opacity: 0.2; cursor: default; }
    .pnav-dir { font-size: 12px; font-weight: 600; color: var(--muted); }
    .pnav-title {
      font-family: var(--display);
      font-size: clamp(18px, 2.4vw, 26px);
      font-weight: 700; letter-spacing: -0.03em;
      color: var(--ink);
    }

    /* ─────────────────────────── ABOUT ─────────────────────────── */
    .about {
      padding: clamp(32px, 7vw, 88px) var(--pad) clamp(48px, 8vw, 96px);
      max-width: 1100px;
    }
    .about-headline {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(36px, 8vw, 104px);
      letter-spacing: -0.045em;
      line-height: 0.92;
      text-wrap: balance;
      margin-bottom: clamp(32px, 6vw, 64px);
    }
    .about-headline .accent { color: var(--red); }

    .about-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: clamp(28px, 6vw, 80px);
      align-items: start;
    }
    .about-block { margin-bottom: 36px; }
    .about-eyebrow {
      display: block;
      font-size: 13px; font-weight: 600; color: var(--muted);
      margin-bottom: 14px; letter-spacing: -0.01em;
    }
    .about-bio {
      font-size: clamp(17px, 2vw, 22px);
      font-weight: 500;
      line-height: 1.5;
      letter-spacing: -0.02em;
      text-wrap: pretty;
    }
    .disciplines { list-style: none; }
    .disciplines li {
      font-family: var(--display);
      font-size: clamp(20px, 2.6vw, 30px);
      font-weight: 700;
      letter-spacing: -0.03em;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      transition: color 0.2s var(--ease-out), transform 0.3s var(--spring);
    }
    .disciplines li:first-child { border-top: 1px solid var(--line); }
    .disciplines li:hover { color: var(--red); transform: translateX(8px); }

    .contact { list-style: none; }
    .contact li {
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .contact li:first-child { border-top: 1px solid var(--line); }
    .contact-k { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
    .contact-v {
      font-family: var(--display);
      font-size: 18px; font-weight: 700; letter-spacing: -0.025em;
      color: var(--ink); text-decoration: none;
      transition: color 0.2s;
    }
    a.contact-v:hover { color: var(--red); }
    .about-rep {
      margin-top: 28px;
      font-size: 14px; font-weight: 500; color: var(--muted);
      line-height: 1.55; text-wrap: pretty;
    }

    /* ─────────────────── SCROLL REVEAL + FILTER POP ─────────────── */
    @keyframes cardPop {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    /* reveal class only added by JS when motion is allowed, so content
       is always visible by default (progressive enhancement) */
    .card.reveal { opacity: 0; transform: translateY(24px); }
    .card.reveal.in {
      opacity: 1; transform: none;
      transition: opacity 0.6s var(--ease-out), transform 0.6s var(--ease-out);
    }
    .card.pop { animation: cardPop 0.5s var(--ease-out) both; }

    /* ─────────────────── CUSTOM CURSOR (fine pointers) ──────────── */
    html.has-cursor, html.has-cursor * { cursor: none; }
    .cursor { position: fixed; top: 0; left: 0; z-index: 300; pointer-events: none; opacity: 0; will-change: transform; }
    .cursor.ready { opacity: 1; }
    .cursor-dot {
      position: absolute;
      width: 11px; height: 11px; border-radius: 50%;
      background: var(--red);
      transform: translate(-50%, -50%) scale(1);
      transition: transform 0.28s var(--spring), opacity 0.2s var(--ease), background 0.3s var(--ease);
    }
    .cursor-pill {
      position: absolute;
      transform: translate(-50%, -50%) scale(0.5);
      opacity: 0;
      background: var(--ink); color: var(--paper);
      font: 600 12px/1 var(--body); letter-spacing: -0.01em; white-space: nowrap;
      padding: 9px 14px; border-radius: 100px;
      transition: transform 0.28s var(--spring), opacity 0.2s var(--ease);
    }
    .cursor.is-pill .cursor-dot  { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    .cursor.is-pill .cursor-pill { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    .cursor.is-down .cursor-dot  { transform: translate(-50%, -50%) scale(0.55); }
    .cursor.is-down.is-pill .cursor-pill { transform: translate(-50%, -50%) scale(0.92); }

    /* ─────────────────── EASTER EGG: raining work ───────────────── */
    .rain-item {
      position: fixed; top: 0; z-index: 290;
      border-radius: 10px; pointer-events: none;
      will-change: transform, opacity;
      box-shadow: 0 10px 34px rgba(0,0,0,0.20);
      object-fit: cover;
    }

    /* ─────────────────── SHARED-ELEMENT (View Transitions) ──────── */
    ::view-transition-group(hero-media) {
      animation-duration: 0.5s;
      animation-timing-function: var(--ease-out);
    }
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0.32s;
      animation-timing-function: var(--ease);
    }

    /* directional prev/next: content slides toward the direction of travel */
    @keyframes vtInRight  { from { opacity: 0; transform: translateX(36px); }  to { opacity: 1; transform: none; } }
    @keyframes vtOutLeft  { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(-36px); } }
    @keyframes vtInLeft   { from { opacity: 0; transform: translateX(-36px); } to { opacity: 1; transform: none; } }
    @keyframes vtOutRight { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(36px); } }
    html.vt-next::view-transition-new(root) { animation: vtInRight  0.4s var(--ease-out); }
    html.vt-next::view-transition-old(root) { animation: vtOutLeft  0.32s var(--ease-out); }
    html.vt-prev::view-transition-new(root) { animation: vtInLeft   0.4s var(--ease-out); }
    html.vt-prev::view-transition-old(root) { animation: vtOutRight 0.32s var(--ease-out); }

    /* ─────────────────────────── RESPONSIVE ─────────────────────── */
    @media (max-width: 820px) {
      /* stack the stage: media on top, info below (no sticky) */
      .project-stage { grid-template-columns: 1fr; gap: 24px; }
      .project-info { position: static; top: auto; }
      .pview-bar { margin-bottom: 14px; }
    }
    @media (max-width: 720px) {
      .about-grid { grid-template-columns: 1fr; }
      .controls { align-items: flex-start; }
    }

    /* ── MOBILE: designed for touch ──────────────────────────────── */
    @media (max-width: 640px) {
      /* tighter, balanced header that holds all three links + dots */
      header { padding: 14px var(--pad); gap: 12px; }
      .wordmark { font-size: 24px; }
      .header-right { gap: 16px; }
      .nav { gap: 15px; }
      .nav a { font-size: 13px; }
      .nav a::after { bottom: 7px; }
      .dots { gap: 9px; }
      .dot { width: 13px; height: 13px; }

      /* no hover on touch, so the title never swaps — drop the reserve
         that was leaving a dead gap, and tighten the top block */
      .controls { padding: clamp(22px, 7vw, 34px) var(--pad) 12px; gap: 10px; }
      .controls-lead { min-height: 0; max-width: none; }
      .controls-lead h1 { font-size: clamp(34px, 12vw, 46px); -webkit-line-clamp: 3; }

      /* filters become a full-bleed, swipeable strip (no awkward wrap) */
      .filters {
        width: 100%;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 8px;
        margin: 0 calc(var(--pad) * -1);
        padding: 2px var(--pad) 4px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .filters::-webkit-scrollbar { display: none; }
      .filters button { flex: 0 0 auto; }

      .grid { padding-top: 4px; }

      /* project detail, tightened for small screens */
      .pview-bar { padding-top: clamp(14px, 4vw, 22px); }
      .project-title { font-size: clamp(30px, 9vw, 44px); }
      .project-desc { font-size: 15px; }
      .meta-value { font-size: 15px; }
      .pnav-title { font-size: 16px; }

      /* about, tightened */
      .about-headline { font-size: clamp(34px, 11vw, 54px); }
      .about-bio { font-size: 17px; }
      .disciplines li { font-size: clamp(20px, 6vw, 26px); }
    }

    /* ── TABLET (portrait, ~641–820px) ──────────────────────────── */
    @media (min-width: 641px) and (max-width: 820px) {
      .controls { padding-bottom: 16px; }
      .controls-lead { max-width: 32ch; }
      .grid { column-width: clamp(210px, 30vw, 280px); gap: 16px; }
      .about-headline { font-size: clamp(44px, 8vw, 72px); }
      .project-title { font-size: clamp(34px, 5vw, 52px); }
    }

    /* Touch devices (phones + tablets) never hover-swap the title,
       so drop the reserved height that would otherwise leave a gap. */
    @media (hover: none) {
      .controls-lead { min-height: 0; }
    }

    /* ── REDUCED MOTION — global safety net ──────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

  <script>
    // honour reduced motion (no SPA here): pause autoplay, show first frame
    if (matchMedia('(prefers-reduced-motion: reduce)').matches)
      document.querySelectorAll('video').forEach(v => { v.removeAttribute('autoplay'); v.pause(); });
    // correct video boxes to true ratio
    document.querySelectorAll('video').forEach(v => {
      const set = () => { if (v.videoWidth && v.videoHeight) v.style.aspectRatio = v.videoWidth + ' / ' + v.videoHeight; };
